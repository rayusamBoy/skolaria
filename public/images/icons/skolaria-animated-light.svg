<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skolaria">
  <style>
    .sk-rect { transform-origin: 256px 256px; animation: sk-pop 700ms cubic-bezier(.2,.7,.2,1) both; }
    .sk-star { transform-origin: 256px 256px; animation: sk-pulse 3.4s ease-in-out 700ms infinite; }
    .sk-s    { stroke-dasharray: 900; stroke-dashoffset: 900; animation: sk-draw 1.4s cubic-bezier(.2,.7,.2,1) 400ms forwards; }
    @keyframes sk-pop   { 0% { transform: scale(0.82); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes sk-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    @keyframes sk-draw  { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .sk-rect, .sk-star, .sk-s { animation: none; }
      .sk-s { stroke-dashoffset: 0; }
    }
  </style>

  <rect class="sk-rect" width="512" height="512" rx="112" fill="#FFFFFF"/>
  <g transform="translate(256, 256)">
    <polygon class="sk-star"
             points="0,-208 48,-64 208,0 48,64 0,208 -48,64 -208,0 -48,-64"
             fill="#1B1F3B"/>
    <path class="sk-s"
          d="M 88,-80 Q 88,-104 64,-104 L -48,-104 Q -80,-104 -80,-72 L -80,-32 Q -80,0 -48,0 L 48,0 Q 80,0 80,32 L 80,72 Q 80,104 48,104 L -64,104 Q -88,104 -88,80"
          fill="none" stroke="#F5A623" stroke-width="36"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>